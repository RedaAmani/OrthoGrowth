[package]
name = "orthogrowth-android"
version = "0.5.2"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "OrthoGrowth pour Android : point d'entrée de l'application (le reste est dans le crate `orthogrowth`)"
publish = false

[lib]
# Pas de `name` : xbuild cherche liborthogrowth_android.so (nom du paquet, tirets remplacés par des soulignés).
crate-type = ["cdylib"]

[dependencies]
orthogrowth-app = { package = "orthogrowth", path = "../app", features = ["android-glue"] }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
