name: Compiler OrthoGrowth natif

# Lancer à la main : onglet Actions > « Compiler OrthoGrowth natif » > Run workflow.
# Publier une version : git tag native-v0.5.1 && git push origin native-v0.5.1
on:
  workflow_dispatch:
  push:
    tags: ["native-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bin: OrthoGrowth.exe
            # Intègre le runtime C au programme : aucun « Visual C++ Redistributable » à installer.
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            platform: linux-x64
            bin: OrthoGrowth
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Dépendances Linux (polices)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Tests du noyau de calcul
        run: cargo test --locked --release -p orthogrowth-core
      - name: Compilation
        run: cargo build --locked --release -p orthogrowth
      - name: Empaquetage
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          NAME="OrthoGrowth-${VERSION}-${{ matrix.platform }}"
          mkdir "$NAME"
          cp "target/release/${{ matrix.bin }}" "$NAME/"
          cp dist-doc/LISEZ-MOI.txt "$NAME/"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: native/${{ env.NAME }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives ZIP
        run: |
          chmod +x dist/*linux-x64/OrthoGrowth
          cd dist && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          name: OrthoGrowth natif ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
