name: Compiler OrthoGrowth natif

# Trois façons de le lancer :
# 1. Actions > « Compiler OrthoGrowth natif » > Run workflow, champ « tag » VIDE
#    -> exécutables en artefacts seulement (essai, aucune Release).
# 2. Même chose avec le champ « tag » rempli (ex. native-v0.5.2)
#    -> crée la Release de ce tag, ou complète celle qui existe, et y joint les ZIP.
# 3. Releases > Draft a new release > tag native-vX.Y.Z > Publish release
#    -> les ZIP sont joints automatiquement.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la Release à créer ou compléter (ex. native-v0.5.2). Vide = artefacts seulement."
        required: false
        default: ""
        type: string
  release:
    types: [published]
  push:
    tags: ["native-v*"]

# Si deux déclencheurs partent pour le même tag, un seul run va jusqu'au bout.
concurrency:
  group: native-${{ github.ref }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    # Les Releases du plugin (autres tags) ne déclenchent pas cette compilation.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bin: OrthoGrowth.exe
            # Intègre le runtime C au programme : aucun « Visual C++ Redistributable » à installer.
            rustflags: "-C target-feature=+crt-static"
          # Ubuntu 24.04 figé (et non ubuntu-latest, qui passe à Ubuntu 26) : le binaire Linux
          # est lié à la version de la bibliothèque système (glibc) de la machine qui le compile.
          - os: ubuntu-24.04
            platform: linux-x64
            bin: OrthoGrowth
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Dépendances Linux (polices)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Tests du noyau de calcul
        run: cargo test --locked --release -p orthogrowth-core
      - name: Compilation
        run: cargo build --locked --release -p orthogrowth
      - name: Empaquetage
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          NAME="OrthoGrowth-${VERSION}-${{ matrix.platform }}"
          mkdir "$NAME"
          cp "target/release/${{ matrix.bin }}" "$NAME/"
          cp dist-doc/LISEZ-MOI.txt "$NAME/"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: native/${{ env.NAME }}

  release:
    name: release (joindre les ZIP)
    needs: build
    # Release demandée par un tag poussé, par la publication d'une Release, ou par le champ « tag » du lancement manuel.
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Vérifier le nom du tag
        run: |
          case "$TAG" in
            native-v*) echo "Release visée : $TAG" ;;
            *) echo "Le tag doit commencer par native-v (reçu : '$TAG')"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Archives ZIP
        run: |
          chmod +x dist/*linux-x64/OrthoGrowth
          cd dist && for d in */; do zip -qr "${d%/}.zip" "$d"; done
          ls -la
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.zip
          fail_on_unmatched_files: true
